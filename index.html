<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treaty Segmentation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Text Segmentation: "The Scissors"</h1>
            <p><strong>Instructions:</strong> Click on any word to drop a segment boundary <em>after</em> that word. Click it again to remove it.</p>
            
            <!-- Document Selector Dropdown Added Here -->
            <div style="margin-top: 15px;">
                <label for="doc-selector"><strong>Select Document:</strong></label>
                <select id="doc-selector" style="padding: 6px 12px; margin-left: 8px; border-radius: 4px;"></select>
            </div>
        </header>

        <!-- Document Text Container -->
        <div id="text-container" class="text-box"></div>

        <!-- Segmentation Controls -->
        <div class="controls">
            <button id="export-btn">Grade Cuts</button>
            <button id="review-btn" style="background-color: #059669;">Review & Annotate</button>
            <button id="clear-btn" style="background-color: #ef4444;">Clear All Cuts</button>
        </div>

        <div id="output-console" class="console">
            Awaiting cuts...
        </div>

        <!-- Optional Reconciliation UI Container -->
        <div id="reconcile-container" style="display: none; margin-top: 20px; border: 1px solid #d1d5db; padding: 15px; border-radius: 6px; background-color: #f8fafc;">
            <h3>Adjudicate Disagreements</h3>
            <div id="reconcile-list"></div>
            <button id="save-consensus-btn" style="background-color: #2563eb; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">
                Save Consensus Baseline
            </button>
        </div>

        <!-- Annotation Screen (Hidden by default) -->
        <div id="annotation-container" style="display: none; margin-top: 20px;">
            <h2>Review & Annotate Segments</h2>
            <div id="segments-list"></div>

            <div style="margin-top: 20px;">
                <label for="problems-dropdown"><strong>Problems Encountered with Text:</strong></label>
                <select id="problems-dropdown" style="width: 100%; padding: 8px; margin-top: 5px;"></select>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button id="back-btn" style="background-color: #6b7280;">Back to Editing</button>
                <button id="submit-btn" style="background-color: #16a34a;">Submit Final Annotations</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
